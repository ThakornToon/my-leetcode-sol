name: Sync LeetCode

on:
  workflow_dispatch: # อนุญาตให้กดปุ่มรันมือได้ตลอดเวลา
  schedule:
    - cron: "0 0 * * *" # ตั้งเวลาให้รันอัตโนมัติทุกวัน (ถ้าต้องการ)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Sync LeetCode Submissions
        uses: ThakornToon/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          leetcode-csrf-token: ${{ secrets.CSRFTOKEN }}
          destination-folder: "solutions"

      - name: Generate README files
        run: python generate_readme.py

      - name: Commit and push generated README files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md EASY.md MEDIUM.md HARD.md TOPICS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update generated LeetCode README files"
            git push
          else
            echo "No generated README changes to commit."
          fi
